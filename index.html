<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3PL CX 콘솔</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f8f9fa;
    --line: #e4e6ea;
    --line-strong: #cfd3da;
    --text: #16181d;
    --text-2: #4b5059;
    --text-3: #7c828d;
    --accent: #2a78d6;
    --accent-weak: #e8f1fc;
    --sidebar: #15181e;
    --sidebar-text: #aeb4bf;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 14px;
    color: var(--text);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); word-break: keep-all; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }

  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: var(--sidebar); color: var(--sidebar-text); padding: 20px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { color: #fff; font-weight: 700; font-size: 16px; padding: 0 10px 4px; }
  .brand-sub { font-size: 12px; padding: 0 10px 20px; color: #7d8491; }
  .nav-group { font-size: 11px; color: #6c7380; padding: 16px 10px 6px; letter-spacing: .04em; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--sidebar-text); padding: 9px 10px; border-radius: 8px; }
  .nav-item:hover { background: #222631; color: #fff; }
  .nav-item.active { background: #2a2f3b; color: #fff; font-weight: 600; }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; }

  .main { min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .topbar h1 { font-size: 18px; margin: 0; flex: 1; }
  .client-picker { position: relative; }
  .client-picker input { width: 260px; padding: 7px 30px 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
  .client-picker .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--text-3); font-size: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
  .chip.test::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--warning); }
  .chip.live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--critical); }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 14px; border-radius: 8px; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #2267bb; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .content { padding: 24px 28px 60px; }
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .section-title h2 { font-size: 15px; margin: 0; }
  .muted { color: var(--text-3); font-size: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px; min-width: 0; }
  .kpi .label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .kpi.clickable { cursor: pointer; }
  .kpi.clickable:hover { border-color: var(--line-strong); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  .alerts { display: flex; flex-direction: column; }
  .alert-row { display: grid; grid-template-columns: 20px 1fr auto 150px; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .alert-row:first-child { border-top: 0; }
  .alert-row .name { font-weight: 600; }
  .alert-row .desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .alert-row .count { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }
  .alert-actions { display: flex; gap: 6px; justify-content: flex-end; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); }
  .field input, .field select, .field textarea { padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font-size: 13px; }
  .field textarea { resize: vertical; min-height: 70px; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--text-2); background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover td { background: #fafbfc; }
  tbody tr.selected td { background: var(--accent-weak); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--text-2); }
  .pager .btns { display: flex; gap: 6px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; color: var(--text); }
  .badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .badge.good::before { background: var(--good); }
  .badge.warning::before { background: var(--warning); }
  .badge.serious::before { background: var(--serious); }
  .badge.critical::before { background: var(--critical); }
  .badge.progress::before { background: var(--accent); }

  .chart-legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart-box { position: relative; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.08); display: none; white-space: nowrap; }
  .chart-tip b { display: block; margin-bottom: 4px; }
  .chart-tip div { display: flex; align-items: center; gap: 6px; }

  .tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab { background: none; border: 0; padding: 9px 14px; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .report-layout { display: grid; grid-template-columns: 380px 1fr; gap: 16px; align-items: start; }
  .report-form .field { margin-bottom: 12px; }
  .report-form .field input, .report-form .field select, .report-form .field textarea { width: 100%; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .recipients { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--line-strong); border-radius: 8px; min-height: 38px; background: var(--surface); }
  .recipients .chip button { border: 0; background: none; padding: 0; color: var(--text-3); }
  .recipients input { border: 0; outline: none; flex: 1; min-width: 160px; padding: 4px; font-size: 13px; }
  .note { font-size: 12px; color: var(--text-3); margin-top: 4px; line-height: 1.5; }
  .note.warn { color: #9a5b00; }
  .mail-preview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .mail-head { padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 13px; display: grid; grid-template-columns: 70px 1fr; row-gap: 6px; }
  .mail-head .k { color: var(--text-3); }
  .mail-body { padding: 18px; max-height: 640px; overflow: auto; }
  .empty { padding: 40px; text-align: center; color: var(--text-3); }
  .loading { padding: 40px; text-align: center; color: var(--text-3); }
  .error-box { padding: 14px 16px; border: 1px solid #f1c4c4; background: #fdf3f3; border-radius: var(--radius); color: #8f2323; font-size: 13px; }

  .drawer-bg { position: fixed; inset: 0; background: rgba(15,17,21,.35); display: none; z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); box-shadow: -8px 0 30px rgba(0,0,0,.12); transform: translateX(100%); transition: transform .2s; z-index: 21; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .drawer-head h3 { margin: 0; font-size: 16px; }
  .drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .kv { display: grid; grid-template-columns: 110px 1fr; row-gap: 8px; column-gap: 10px; font-size: 13px; margin-bottom: 18px; }
  .kv .k { color: var(--text-3); }
  .drawer h4 { font-size: 13px; margin: 18px 0 8px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 7px 0; border-left: 2px solid var(--line); padding-left: 12px; position: relative; font-size: 13px; }
  .timeline li::before { content: ''; position: absolute; left: -5px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  .timeline li:last-child::before { background: var(--accent); }
  .timeline .t { color: var(--text-3); font-size: 12px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(15,17,21,.45); display: none; align-items: center; justify-content: center; z-index: 30; }
  .modal { background: var(--surface); border-radius: 12px; width: min(520px, 92vw); padding: 22px; }
  .modal h3 { margin: 0 0 6px; font-size: 17px; }
  .modal .field { margin-top: 12px; }
  .modal .field input { width: 100%; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1d2129; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 40; max-width: 80vw; }

  @media (max-width: 1360px) {
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 1100px) {
    .grid-2, .report-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; }
    .brand-sub, .nav-group { display: none; }
    .nav-item { width: auto; }
    .topbar { flex-wrap: wrap; }
    .client-picker input { width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">3PL CX 콘솔</div>
    <div class="brand-sub">화장품 물류센터 · 화주사 운영</div>
    <div class="nav-group">모니터링</div>
    <button class="nav-item" data-view="home"><span class="dot"></span>대시보드</button>
    <div class="nav-group">업무 조회</div>
    <button class="nav-item" data-view="orders"><span class="dot"></span>주문 · 출고</button>
    <button class="nav-item" data-view="shipments"><span class="dot"></span>배송</button>
    <button class="nav-item" data-view="inbounds"><span class="dot"></span>입고</button>
    <button class="nav-item" data-view="inventory"><span class="dot"></span>재고</button>
    <button class="nav-item" data-view="returns"><span class="dot"></span>반품</button>
    <button class="nav-item" data-view="settlements"><span class="dot"></span>정산</button>
    <div class="nav-group">화주사 커뮤니케이션</div>
    <button class="nav-item" data-view="report"><span class="dot"></span>리포트 발송</button>
    <button class="nav-item" data-view="schedules"><span class="dot"></span>자동 발송</button>
    <button class="nav-item" data-view="logs"><span class="dot"></span>발송 기록</button>
    <button class="nav-item" data-view="clients"><span class="dot"></span>화주사 · 담당자</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">대시보드</h1>
      <div class="client-picker">
        <input id="clientInput" list="clientList" placeholder="전체 화주사 (이름·ID 검색)">
        <button class="clear" id="clientClear" title="전체 화주사">×</button>
        <datalist id="clientList"></datalist>
      </div>
      <span class="chip" id="baseTimeChip">기준 시각 -</span>
      <span class="chip" id="mailModeChip">메일 모드 -</span>
      <button class="btn small" id="refreshBtn">새로고침</button>
      <button class="btn small" id="settingsBtn">연결 설정</button>
    </header>
    <section class="content" id="view"></section>
  </div>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3 id="drawerTitle"></h3><button class="btn small" id="drawerClose">닫기</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>연결 설정</h3>
    <div class="muted">앱스 스크립트 웹 앱 URL과 API 키를 입력합니다. 이 브라우저에만 저장됩니다.</div>
    <div class="field">웹 앱 URL<input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div class="field">API 키<input id="cfgKey" placeholder="key-..."></div>
    <div id="cfgMsg" class="note"></div>
    <div class="modal-actions">
      <button class="btn" id="cfgCancel">닫기</button>
      <button class="btn primary" id="cfgSave">저장 후 연결</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle"></h3>
    <div id="confirmBody" class="note" style="font-size:13px;color:var(--text-2)"></div>
    <div class="modal-actions">
      <button class="btn" id="confirmNo">취소</button>
      <button class="btn primary" id="confirmYes">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ───────────────────────── 상태 · 공통 ─────────────────────────
const state = {
  baseUrl: '', apiKey: '', meta: null, baseDate: '',
  clients: [], clientMap: {}, client: '',
  view: 'home', cache: new Map(), filters: {}, pages: {},
  report: null,
};
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const num = (v) => (v == null || v === '' ? '-' : Number(v).toLocaleString('ko-KR'));
const dt = (v) => (v ? String(v).slice(5, 16).replace('T', ' ') : '-');
const d10 = (v) => (v ? String(v).slice(0, 10) : '-');
function addDays(ymd, n) {
  const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10);
}
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }

const REPORT_TYPES = {
  daily_summary: '일일 운영 요약', outbound_delay: '출고지연 현황', delivery_failed: '배송실패 현황',
  stock_alert: '안전재고 미달 알림', expiry_alert: '사용기한 임박 알림', inbound_issue: '입고 이슈 알림',
  return_status: '반품 처리 현황', settlement: '월 정산서',
};
const STATUS = {
  order: { RECEIVED: '주문접수', ALLOCATED: '재고할당', PICKING: '피킹중', PICKED: '피킹완료', PACKING: '패킹중', PACKED: '패킹완료', SHIPPED: '출고완료', IN_TRANSIT: '배송중', OUT_FOR_DELIVERY: '배송출발', DELIVERED: '배송완료', DELIVERY_FAILED: '배송실패', HOLD: '출고보류', CANCELLED: '주문취소' },
  inbound: { SCHEDULED: '입고예정', ARRIVED: '도착', INSPECTING: '검수중', COMPLETED: '입고완료' },
  shipment: { SHIPPED: '집하완료', IN_TRANSIT: '배송중', OUT_FOR_DELIVERY: '배송출발', DELIVERED: '배송완료', DELIVERY_FAILED: '배송실패' },
  return: { REQUESTED: '반품접수', PICKUP_SCHEDULED: '회수예정', COLLECTED: '회수완료', RECEIVED: '센터입고', INSPECTING: '검수중', COMPLETED: '처리완료' },
  settlement: { DRAFT: '산정중', CONFIRMED: '확정', INVOICED: '청구완료', PAID: '입금완료' },
};
const TONE = {
  DELIVERED: 'good', COMPLETED: 'good', DONE: 'good', PAID: 'good', SHIPPED: 'good', RESTOCKED: 'good', SENT: 'good',
  DELIVERY_FAILED: 'critical', HOLD: 'serious', DISPOSED: 'serious', CANCELLED: '',
  ALLOCATED: 'progress', PICKING: 'progress', PICKED: 'progress', PACKING: 'progress', PACKED: 'progress', IN_TRANSIT: 'progress', OUT_FOR_DELIVERY: 'progress',
  SCHEDULED: '', ARRIVED: 'progress', INSPECTING: 'progress', REQUESTED: 'warning', PICKUP_SCHEDULED: 'progress', COLLECTED: 'progress', RECEIVED: 'progress',
  DRAFT: 'warning', CONFIRMED: 'progress', INVOICED: 'progress',
};
const badge = (code, label) => `<span class="badge ${TONE[code] || ''}">${esc(label || code)}</span>`;
const flag = (tone, label) => `<span class="badge ${tone}">${esc(label)}</span>`;

function toast(msg, ms = 3200) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), ms);
}

// ───────────────────────── API ─────────────────────────
// 경로는 ?path= 로 전달 (웹 앱 URL 뒤에 /v1/... 를 붙이면 fetch 호출이 차단됨)
// 앱스 스크립트는 오류여도 HTTP 200을 반환하므로 응답의 error 필드로 판단
async function api(path, params = {}, useCache = true) {
  const q = new URLSearchParams({ path });
  Object.entries(params).forEach(([k, v]) => { if (v !== '' && v != null) q.set(k, v); });
  q.set('api_key', state.apiKey);
  const url = `${state.baseUrl}?${q}`;
  if (useCache && state.cache.has(url)) return state.cache.get(url);
  const p = fetch(url).then((r) => r.json()).then((j) => {
    if (j.error) { const e = new Error(j.error.message); e.code = j.error.code; throw e; }
    return j;
  });
  if (useCache) { state.cache.set(url, p); p.catch(() => state.cache.delete(url)); }
  return p;
}
async function apiAll(path, params = {}, maxPages = 20) {
  let page = 1, all = [];
  while (true) {
    const j = await api(path, { ...params, page, page_size: 100 });
    all = all.concat(j.data);
    if (page >= j.meta.total_pages || page >= maxPages) return all;
    page++;
  }
}
// 발송(POST): Content-Type을 text/plain으로 보내야 브라우저 사전 요청(CORS) 없이 전달됨
async function apiPost(path, body) {
  const res = await fetch(`${state.baseUrl}?path=${encodeURIComponent(path)}`, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, api_key: state.apiKey }),
  });
  const j = await res.json();
  if (j.error) throw new Error(j.error.details ? j.error.details.join(' / ') : j.error.message);
  return j.data;
}
const clientParam = () => (state.client ? { client_id: state.client } : {});

    $('clientTable').querySelectorAll('th.sortable').forEach((th) => (th.onclick = () => {
      ct.dir = ct.sort === th.dataset.key ? -ct.dir : -1; ct.sort = th.dataset.key; drawClientTable();
    }));

    $('ctPrev').onclick = () => { ct.page--; drawClientTable(); };

  };
  $('clientTableSearch').oninput = (e) => { ct.q = e.target.value.trim(); ct.page = 1; drawClientTable(); };

function tableHtml(cols, rows, opt = {}) {
  if (!rows.length) return `<div class="table-wrap"><div class="empty">${opt.empty || '조회된 데이터가 없습니다.'}</div></div>`;
  const head = cols.map((c) => {
    const sortable = opt.sort !== undefined;
    const arrow = opt.sort === c.key ? (opt.dir > 0 ? ' ▲' : ' ▼') : '';
    return `<th class="${c.num ? 'num' : ''} ${sortable ? 'sortable' : ''}" data-key="${c.key}">${c.label}${arrow}</th>`;
  }).join('');
  const body = rows.map((r) => {
    const sel = opt.selected && r.client_id === opt.selected && opt.selectedKey !== false;
    return `<tr class="${opt.clickable ? 'clickable' : ''} ${sel ? 'selected' : ''}">${cols.map((c) => {
      const v = c.render ? c.render(r) : c.num ? num(r[c.key]) : esc(r[c.key] == null ? '-' : r[c.key]);
      return `<td class="${c.num ? 'num' : ''} ${c.mono ? 'mono' : ''}">${v}</td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// 최근 7일 추이: 묶은 막대 (3계열), 마우스를 올리면 날짜별 값 표시
function drawTrend(data) {
  const box = $('trendChart');
  const W = Math.max(box.clientWidth || 480, 320), H = 230, m = { t: 10, r: 8, b: 26, l: 40 };
  const keys = [['received', '주문접수', 'var(--series-1)'], ['shipped', '출고완료', 'var(--series-2)'], ['delivered', '배송완료', 'var(--series-3)']];
  const max = Math.max(1, ...data.flatMap((d) => keys.map(([k]) => d[k])));
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const top = Math.ceil(max / step) * step;
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const gw = iw / data.length, bw = Math.min(14, (gw - 12) / 3), gap = 2;
  const y = (v) => m.t + ih - (v / top) * ih;
  const ticks = [0, top / 2, top];
  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="최근 7일 주문접수·출고완료·배송완료 추이">`;
  ticks.forEach((t) => {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="#e4e6ea" stroke-width="1"/>`;
    svg += `<text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#7c828d">${num(t)}</text>`;
  });
  data.forEach((d, i) => {
    const gx = m.l + i * gw + (gw - (bw * 3 + gap * 2)) / 2;
    keys.forEach(([k, , color], j) => {
      const h = Math.max(0, m.t + ih - y(d[k]));
      const x = gx + j * (bw + gap), r = Math.min(4, bw / 2, h);
      if (h > 0) svg += `<path d="M${x},${m.t + ih} V${m.t + ih - h + r} Q${x},${m.t + ih - h} ${x + r},${m.t + ih - h} H${x + bw - r} Q${x + bw},${m.t + ih - h} ${x + bw},${m.t + ih - h + r} V${m.t + ih} Z" fill="${color}"/>`;
    });
    svg += `<text x="${m.l + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#7c828d">${d.date.slice(5).replace('-', '/')}</text>`;
    svg += `<rect x="${m.l + i * gw}" y="${m.t}" width="${gw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  svg += '</svg><div class="chart-tip" id="trendTip"></div>';
  box.innerHTML = svg;
  const tip = $('trendTip');
  box.querySelectorAll('rect[data-i]').forEach((r) => {
    r.onmousemove = (e) => {
      const d = data[r.dataset.i];
      tip.innerHTML = `<b>${d.date}</b>` + keys.map(([k, label, color]) => `<div><i class="status-dot" style="background:${color}"></i>${label} ${num(d[k])}</div>`).join('');
      const rect = box.getBoundingClientRect();
      let left = e.clientX - rect.left + 12; if (left > W - 140) left -= 160;
      tip.style.left = left + 'px'; tip.style.top = (e.clientY - rect.top - 10) + 'px'; tip.style.display = 'block';
    };
    r.onmouseleave = () => (tip.style.display = 'none');
  });
}

async function renderList(view) {
  const cfg = LIST[view];
  const f = (state.filters[view] = state.filters[view] || {});
  const pg = (state.pages[view] = state.pages[view] || { page: 1 });
  const fields = cfg.filters.map((x) => {
    if (x.type === 'select') return `<div class="field">${x.label}<select data-f="${x.key}">${x.options.map(([v, l]) => `<option value="${esc(v)}" ${f[x.key] === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    return `<div class="field">${x.label}<input data-f="${x.key}" value="${esc(f[x.key] || '')}"></div>`;
  }).join('') + (cfg.dateLabel ? `
    <div class="field">${cfg.dateLabel} 시작<input type="date" data-f="date_from" value="${esc(f.date_from || '')}"></div>
    <div class="field">${cfg.dateLabel} 종료<input type="date" data-f="date_to" value="${esc(f.date_to || '')}"></div>` : '');
  $('view').innerHTML = `
    <div class="filters">${fields}<button class="btn primary" id="listSearch">조회</button><button class="btn" id="listReset">초기화</button></div>
    <div id="listResult"><div class="loading">불러오는 중입니다...</div></div>`;
  const readFilters = () => {
    $('view').querySelectorAll('[data-f]').forEach((el) => { f[el.dataset.f] = el.value.trim(); });
  };
  $('listSearch').onclick = () => { readFilters(); pg.page = 1; load(); };
  $('view').querySelectorAll('input[data-f]').forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('listSearch').click(); }));
  $('listReset').onclick = () => { state.filters[view] = {}; pg.page = 1; renderList(view); };
  const load = async () => {
    const token = (load._t = Symbol());
    $('listResult').innerHTML = '<div class="loading">불러오는 중입니다...</div>';
    try {
      const j = await api(cfg.path, { ...f, ...clientParam(), page: pg.page, page_size: 50 });
      if (token !== load._t) return;
      const { data, meta } = j;
      $('listResult').innerHTML = `<div class="muted" style="margin-bottom:8px">총 ${num(meta.total)}건${state.client ? ` · ${esc(state.clientMap[state.client].name)}` : ''}</div>`
        + tableHtml(cfg.columns, data, { clickable: !!cfg.detail })
        + `<div class="pager"><span>${meta.page} / ${meta.total_pages} 페이지</span><span class="btns">
           <button class="btn small" id="pgPrev" ${meta.page <= 1 ? 'disabled' : ''}>이전</button>
           <button class="btn small" id="pgNext" ${meta.page >= meta.total_pages ? 'disabled' : ''}>다음</button></span></div>`;
      $('pgPrev').onclick = () => { pg.page--; load(); };
      $('pgNext').onclick = () => { pg.page++; load(); };
      if (cfg.detail) $('listResult').querySelectorAll('tbody tr').forEach((tr, i) => (tr.onclick = () => cfg.detail(data[i])));
    } catch (e) {
      $('listResult').innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    }
  };
  load();
}

function openDrawer(title, html) {
  $('drawerTitle').textContent = title; $('drawerBody').innerHTML = html;

function closeDrawer() { $('drawer').classList.remove('open'); $('drawerBg').style.display = 'none'; }
$('drawerClose').onclick = closeDrawer; $('drawerBg').onclick = closeDrawer;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
const kv = (pairs) => `<div class="kv">${pairs.map(([k, v]) => `<div class="k">${k}</div><div>${v == null || v === '' ? '-' : v}</div>`).join('')}</div>`;

// 상세 패널: 목록에 있는 정보는 바로 표시하고, 진행 이력·배송 이력·반품은 이어서 불러옴
// (주문 상세 API는 시트 여러 개를 읽어 처음 열 때 10초 안팎 걸림. 같은 주문은 10분간 캐시)
function orderSummaryHtml(o) {
  return kv([
    ['화주사', esc(o.client_name)], ['상태', badge(o.status, o.status_label)], ['주문일시', dt(o.ordered_at)], ['판매채널', esc(o.channel)],
    ['고객', `${esc(o.customer.name)} · ${esc(o.customer.phone)}`], ['주소', esc(o.customer.address)],
    ['출고 약속일', esc(o.promised_ship_date)], ['출고지연', o.is_delayed ? flag('critical', '지연') + ' ' + esc(o.delay_reason) : '-'],
    ['택배사 · 운송장', o.tracking_no ? `${esc(o.carrier)} · <span class="mono">${esc(o.tracking_no)}</span>` : '-'],
    ['출고보류', esc(o.hold_reason)],
  ]) + '<h4>상품</h4>' + tableHtml([{ key: 'sku', label: 'SKU', mono: true }, { key: 'product_name', label: '상품명' }, { key: 'qty', label: '수량', num: true }], o.items);
}
async function openOrder(id, row) {
  const isOrderRow = row && row.customer && row.customer.phone !== undefined && row.items;
  const head = isOrderRow ? orderSummaryHtml(row) : '';
  openDrawer(id, head + '<div id="drawerMore"><div class="loading">진행 이력을 불러오는 중입니다. 처음 여는 주문은 10초 정도 걸릴 수 있습니다.</div></div>');
  const myToken = (openOrder._t = Symbol());
  try {
    const o = (await api(`/v1/orders/${id}`)).data;
    if (myToken !== openOrder._t) return;
    let html = isOrderRow ? '' : orderSummaryHtml(o);
    html += '<h4>진행 이력</h4><ul class="timeline">' + o.timeline.map((t) => `<li><span class="t">${dt(t.time)}</span><span>${esc(t.description)}</span></li>`).join('') + '</ul>';
    if (o.shipment) html += '<h4>배송 이력</h4><ul class="timeline">' + o.shipment.events.map((e) => `<li><span class="t">${dt(e.time)}</span><span>${esc(e.description)} <span class="muted">${esc(e.location)}</span></span></li>`).join('') + '</ul>';
    if (o.return) html += '<h4>반품</h4>' + kv([
      ['반품번호', `<span class="mono">${esc(o.return.return_id)}</span>`], ['상태', badge(o.return.status, o.return.status_label)],
      ['사유', esc(o.return.reason)], ['배송비 부담', esc(o.return.fee_payer)], ['처리 결과', o.return.disposition_label ? esc(o.return.disposition_label) : '-'],
      ['검수 메모', esc(o.return.inspection_note)],
    ]);
    if (!isOrderRow) $('drawerBody').innerHTML = html;
    else if ($('drawerMore')) $('drawerMore').innerHTML = html;
  } catch (e) {
    if ($('drawerMore')) $('drawerMore').innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
  }
}

// 메일 양식은 서버(앱스 스크립트)의 리포트 작성 기능 한 곳에서 만듦: 개별·일괄·자동 발송 모두 같은 양식
const RANGE_TYPES = ['outbound_delay', 'delivery_failed', 'inbound_issue', 'return_status'];
const ALERT_TYPES = ['outbound_delay', 'delivery_failed', 'stock_alert', 'expiry_alert', 'inbound_issue'];
const SEND_TONE = { SENT: 'good', READY: 'progress', SKIPPED_EMPTY: '', SKIPPED_TEST: 'warning', NO_RECIPIENT: 'serious', ERROR: 'critical' };

function defaultReport() {
  const t = state.baseDate;
  return {
    tab: 'single', type: 'daily_summary', client: state.client || '', date: t, from: addDays(t, -7), to: t, period: '2026-10',
    to_list: [], cc_list: [], intro: '', attach: true, data: null, loadedKey: '', error: '',
    bulk: { selected: null, q: '', skipEmpty: null, attach: true, dry: null, dryKey: '', result: null },
  };
}
function periodParams(r) {
  if (RANGE_TYPES.includes(r.type)) return { from: r.from, to: r.to };
  if (r.type === 'daily_summary') return { date: r.date };
  if (r.type === 'settlement') return { period: r.period };
  return {};
}
function periodKey(r) { return JSON.stringify([r.type, periodParams(r)]); }
function recipientsFor(type, clientId) {
  const c = state.clientMap[clientId];
  return c ? c.contacts.filter((ct) => ct.receives.includes(type)).map((ct) => ct.email) : [];
}
function fillIntro(template, intro) { return template.replace('{{INTRO}}', esc(intro).replace(/\n/g, '<br>')); }
async function sendMeta() {
  if (!state.sendMeta) state.sendMeta = (await api('/v1/schedules', {}, false)).meta;
  return state.sendMeta;
}

function periodFieldsHtml(r) {
  if (RANGE_TYPES.includes(r.type)) return `<div class="row-2"><div class="field">시작일<input type="date" id="rpFrom" value="${r.from}"></div><div class="field">종료일<input type="date" id="rpTo2" value="${r.to}"></div></div>`;
  if (r.type === 'daily_summary') return `<div class="field">기준일<input type="date" id="rpDate" value="${r.date}" max="${state.baseDate}"></div>`;
  if (r.type === 'settlement') return `<div class="field">정산월<select id="rpMonth"><option ${r.period === '2026-10' ? 'selected' : ''}>2026-10</option><option ${r.period === '2026-11' ? 'selected' : ''}>2026-11</option></select></div>`;
  return `<div class="note" style="margin:-4px 0 12px">기준 시각(${state.baseDate}) 현재 재고 기준으로 작성됩니다.</div>`;
}
function bindPeriodFields(r, onChange) {
  const on = (id, k) => $(id) && ($(id).onchange = (e) => { r[k] = e.target.value; onChange(); });
  on('rpFrom', 'from'); on('rpTo2', 'to'); on('rpDate', 'date'); on('rpMonth', 'period');
}

async function renderReport() {
  const r = (state.report = state.report || defaultReport());
  if (!r.client && state.client) r.client = state.client;
  $('view').innerHTML = `
    <div class="tabs">
      <button class="tab ${r.tab === 'single' ? 'active' : ''}" data-tab="single">개별 발송</button>
      <button class="tab ${r.tab === 'bulk' ? 'active' : ''}" data-tab="bulk">일괄 발송</button>
      <span class="muted" style="margin-left:auto">정해진 시각에 자동으로 보내려면 <a href="#" id="goSchedules">자동 발송</a>에서 예약합니다.</span>
    </div>
    <div id="reportBody"></div>`;
  $('view').querySelectorAll('.tab').forEach((b) => (b.onclick = () => { r.tab = b.dataset.tab; renderReport(); }));
  $('goSchedules').onclick = (e) => { e.preventDefault(); go('schedules'); };
  return r.tab === 'bulk' ? renderBulk(r) : renderSingle(r);
}

// ── 개별 발송: 화주사 1곳, 받는 사람·안내 문구 수정 가능
async function renderSingle(r) {
  const clientOpts = state.clients.map((c) => `<option value="${esc(c.client_id + ' ' + c.name)}"></option>`).join('');
  $('reportBody').innerHTML = `
    <div class="report-layout">
      <div class="card report-form">
        <div class="field">리포트 종류<select id="rpType">${Object.entries(REPORT_TYPES).map(([k, l]) => `<option value="${k}" ${r.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field">화주사<input id="rpClient" list="rpClientList" placeholder="이름 또는 ID 검색" value="${esc(r.client ? r.client + ' ' + state.clientMap[r.client].name : '')}"><datalist id="rpClientList">${clientOpts}</datalist></div>
        <div id="rpPeriod"></div>
        <button class="btn" id="rpLoad" style="width:100%;margin-bottom:14px">데이터 불러오기</button>
        <div class="field">받는 사람<div class="recipients" id="rpTo"></div><div class="note" id="rpToNote"></div></div>
        <div class="field">참조<div class="recipients" id="rpCc"></div></div>
        <div class="field">안내 문구<textarea id="rpIntro" rows="4">${esc(r.intro)}</textarea><div class="note">데이터를 불러오면 리포트 종류에 맞는 문구가 자동으로 들어갑니다. 직접 수정할 수 있습니다.</div></div>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:14px"><input type="checkbox" id="rpAttach" ${r.attach ? 'checked' : ''}>전체 목록을 CSV 파일로 첨부</label>
        <button class="btn primary" id="rpSend" style="width:100%">메일 발송</button>
        <div class="note" id="rpSendNote"></div>
      </div>
      <div class="mail-preview"><div class="mail-head" id="rpHead"></div><div class="mail-body" id="rpBody"></div></div>
    </div>`;

  const markStale = () => { if (r.data && reportKey() !== r.loadedKey) { r.data = null; r.error = ''; drawPreview(); } };
  const reportKey = () => periodKey(r) + '|' + r.client;
  const renderPeriod = () => { $('rpPeriod').innerHTML = periodFieldsHtml(r); bindPeriodFields(r, markStale); };

  const chipList = (boxId, listKey) => {
    const box = $(boxId);
    const draw = () => {
      box.innerHTML = r[listKey].map((m, i) => `<span class="chip">${esc(m)}<button data-i="${i}" title="삭제">×</button></span>`).join('') + '<input placeholder="메일 주소 입력 후 Enter">';
      box.querySelectorAll('button').forEach((b) => (b.onclick = () => { r[listKey].splice(Number(b.dataset.i), 1); draw(); drawHead(); }));
      const input = box.querySelector('input');
      const add = () => {
        const v = input.value.trim().replace(/,$/, '');
        if (!v) return;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { toast('메일 주소 형식을 확인해 주세요.'); return; }
        if (!r[listKey].includes(v)) r[listKey].push(v);
        draw(); drawHead(); box.querySelector('input').focus();
      };
      input.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(); } };
      input.onblur = add;
    };
    draw();
  };
  const recipientNote = () => {
    $('rpToNote').textContent = !r.client ? '화주사를 선택하면 이 리포트를 받는 담당자가 자동으로 입력됩니다.'
      : recipientsFor(r.type, r.client).length ? `${state.clientMap[r.client].name} 담당자 중 '${REPORT_TYPES[r.type]}' 수신 대상입니다.`
        : `${state.clientMap[r.client].name}에는 '${REPORT_TYPES[r.type]}' 수신 담당자가 없습니다. 받는 사람을 직접 입력해 주세요.`;
    $('rpToNote').className = 'note' + (r.client && !recipientsFor(r.type, r.client).length ? ' warn' : '');
  };
  const resetRecipients = () => { r.to_list = r.client ? recipientsFor(r.type, r.client) : []; chipList('rpTo', 'to_list'); recipientNote(); };

  const subject = () => (r.data ? r.data.subject : `[${REPORT_TYPES[r.type]}] ${r.client ? state.clientMap[r.client].name : '화주사'}`);
  const drawHead = () => {
    $('rpHead').innerHTML = `<div class="k">받는 사람</div><div>${esc(r.to_list.join(', ') || '-')}</div>
      <div class="k">참조</div><div>${esc(r.cc_list.join(', ') || '-')}</div>
      <div class="k">제목</div><div><b>${esc(subject())}</b></div>
      <div class="k">첨부</div><div>${r.attach && r.data && r.data.row_count ? esc(r.data.attachment_name) : '-'}</div>`;
  };
  const drawPreview = () => {
    drawHead();
    if (r.error) { $('rpBody').innerHTML = `<div class="error-box">${esc(r.error)}</div>`; return; }
    if (!r.data) { $('rpBody').innerHTML = '<div class="empty">리포트 종류와 화주사를 고르고 <b>데이터 불러오기</b>를 누르면 메일 미리보기가 나옵니다.</div>'; return; }
    $('rpBody').innerHTML = fillIntro(r.data.body_template, r.intro);
  };
  const load = async () => {
    if (!r.client) { toast('화주사를 선택해 주세요.'); return; }
    $('rpLoad').disabled = true; $('rpLoad').textContent = '불러오는 중...';
    r.error = '';
    try {
      r.data = (await api('/v1/reports/compose', { report_type: r.type, client_id: r.client, ...periodParams(r) })).data;
      r.loadedKey = reportKey();
      r.intro = r.data.intro; $('rpIntro').value = r.intro;
    } catch (e) { r.data = null; r.error = `데이터를 불러오지 못했습니다. ${e.message}`; }
    $('rpLoad').disabled = false; $('rpLoad').textContent = '데이터 불러오기';
    drawPreview();
  };

  $('rpType').onchange = (e) => { r.type = e.target.value; r.data = null; r.intro = ''; $('rpIntro').value = ''; renderPeriod(); resetRecipients(); drawPreview(); };
  $('rpClient').onchange = (e) => {
    const v = e.target.value.trim();
    const c = state.clientMap[v.split(' ')[0]] || state.clients.find((x) => x.name === v);
    r.client = c ? c.client_id : '';
    if (c) e.target.value = `${c.client_id} ${c.name}`;
    r.data = null; resetRecipients(); drawPreview();
  };
  $('rpIntro').oninput = (e) => { r.intro = e.target.value; if (r.data) $('rpBody').innerHTML = fillIntro(r.data.body_template, r.intro); };
  $('rpAttach').onchange = (e) => { r.attach = e.target.checked; drawHead(); };
  $('rpLoad').onclick = load;
  $('rpSend').onclick = async () => {
    if (!r.data) { toast('먼저 데이터를 불러와 주세요.'); return; }
    if (reportKey() !== r.loadedKey) { toast('조건이 바뀌었습니다. 데이터를 다시 불러와 주세요.'); return; }
    if (!r.to_list.length) { toast('받는 사람을 입력해 주세요.'); return; }
    const test = /^TEST/.test(state.meta.mail_mode);
    const ok = await confirmBox('메일을 발송할까요?',
      `<b>${esc(subject())}</b><br>받는 사람: ${esc(r.to_list.join(', '))}${r.cc_list.length ? '<br>참조: ' + esc(r.cc_list.join(', ')) : ''}<br><br>`
      + (test ? '테스트 모드입니다. 실제로는 스크립트 속성 TEST_RECIPIENT 메일로만 발송됩니다.' : '<b>실제 발송 모드입니다.</b> 위 주소로 메일이 발송됩니다.'), '발송');
    if (!ok) return;
    $('rpSend').disabled = true; $('rpSendNote').textContent = '발송 중...'; $('rpSendNote').className = 'note';
    try {
      const res = await apiPost('/v1/reports/send', {
        report_type: r.type, client_ids: [r.client], ...periodParams(r),
        intro: r.intro, recipients: r.to_list, cc: r.cc_list, attach: r.attach,
      });
      const x = res.results[0];
      if (x.status !== 'SENT') throw new Error(x.reason || x.status_label);
      $('rpSendNote').textContent = `${x.message_id} ${x.status_label} · 실제 수신: ${x.actual_to.join(', ')}`;
      toast('메일을 발송했습니다.');
    } catch (e) {
      $('rpSendNote').textContent = `발송하지 못했습니다. ${e.message}`; $('rpSendNote').className = 'note warn';
    }
    $('rpSend').disabled = false;
  };

  renderPeriod();
  if (!r.to_list.length) resetRecipients(); else { chipList('rpTo', 'to_list'); recipientNote(); }
  chipList('rpCc', 'cc_list');
  drawPreview();
  if (r.client && !r.data && r.autoLoad !== false) { r.autoLoad = false; load(); }
}

// ── 일괄 발송: 여러 화주사에 같은 리포트를 한 번에. 발송 대상 확인(미리 계산) 후 발송
async function renderBulk(r) {
  const bk = r.bulk;
  if (bk.skipEmpty === null) bk.skipEmpty = ALERT_TYPES.includes(r.type);
  if (!bk.selected) bk.selected = new Set(state.clients.filter((c) => recipientsFor(r.type, c.client_id).length).map((c) => c.client_id));
  let meta = null;
  try { meta = await sendMeta(); } catch (e) { /* 표시만 생략 */ }
  const test = /^TEST/.test(state.meta.mail_mode);
  $('reportBody').innerHTML = `
    <div class="report-layout">
      <div class="card report-form">
        <div class="field">리포트 종류<select id="rpType">${Object.entries(REPORT_TYPES).map(([k, l]) => `<option value="${k}" ${r.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div id="rpPeriod"></div>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px"><input type="checkbox" id="bkSkip" ${bk.skipEmpty ? 'checked' : ''}>안내할 내역이 0건인 화주사는 보내지 않음</label>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:14px"><input type="checkbox" id="bkAttach" ${bk.attach ? 'checked' : ''}>전체 목록을 CSV 파일로 첨부</label>
        <div class="note" style="margin-bottom:12px">받는 사람은 화주사별로 이 리포트를 수신하는 담당자입니다. 제목·본문은 개별 발송과 같은 양식으로 화주사마다 작성됩니다.</div>
        ${test ? `<div class="note warn" style="margin-bottom:12px">테스트 모드: 실제 발송은 처음 ${meta ? meta.test_bulk_limit : 3}곳까지이며, 모두 TEST_RECIPIENT 메일로 갑니다. 나머지는 '테스트 생략'으로 처리됩니다.</div>` : ''}
        <button class="btn" id="bkDry" style="width:100%;margin-bottom:8px">발송 대상 확인</button>
        <button class="btn primary" id="bkSend" style="width:100%">일괄 발송</button>
        <div class="note" id="bkNote"></div>
      </div>
      <div class="card">
        <div class="section-title"><h2>대상 화주사</h2><span class="muted" id="bkCount"></span></div>
        <div class="filters">
          <div class="field">화주사 검색<input id="bkSearch" placeholder="이름 또는 ID" value="${esc(bk.q)}"></div>
          <button class="btn small" id="bkAll">전체 선택</button>
          <button class="btn small" id="bkNone">전체 해제</button>
          <button class="btn small" id="bkHasTo">수신 담당자 있는 화주사만</button>
        </div>
        <div id="bkSummary" class="note" style="margin-bottom:8px"></div>
        <div id="bkTable"></div>
      </div>
    </div>`;

  const key = () => periodKey(r) + '|' + [...bk.selected].sort().join(',') + '|' + bk.skipEmpty + '|' + bk.attach;
  const resultOf = () => (bk.result || (bk.dry && bk.dryKey === key() ? bk.dry : null));
  const drawTable = () => {
    const res = resultOf();
    const byId = res ? Object.fromEntries(res.results.map((x) => [x.client_id, x])) : {};
    const list = state.clients.filter((c) => !bk.q || c.name.includes(bk.q) || c.client_id.toLowerCase().includes(bk.q.toLowerCase()));
    $('bkCount').textContent = `${bk.selected.size}곳 선택`;
    $('bkTable').innerHTML = `<div class="table-wrap" style="max-height:620px;overflow:auto"><table><thead><tr>
        <th style="width:36px"></th><th>화주사</th><th>받는 사람</th><th class="num">건수</th><th>${bk.result ? '결과' : '예정'}</th></tr></thead><tbody>
      ${list.map((c) => {
        const x = byId[c.client_id];
        const to = x ? x.to : recipientsFor(r.type, c.client_id);
        return `<tr><td><input type="checkbox" data-id="${c.client_id}" ${bk.selected.has(c.client_id) ? 'checked' : ''}></td>
          <td>${esc(c.name)} <span class="muted">${c.client_id}</span></td>
          <td class="${to.length ? '' : 'muted'}">${esc(to.join(', ') || '없음')}</td>
          <td class="num">${x && x.row_count != null ? num(x.row_count) : '-'}</td>
          <td>${x ? `<span class="badge ${SEND_TONE[x.status]}">${esc(x.status_label)}</span>${x.message_id ? ` <span class="muted mono">${x.message_id}</span>` : ''}${x.reason ? `<div class="muted">${esc(x.reason)}</div>` : ''}` : '-'}</td></tr>`;
      }).join('')}</tbody></table></div>`;
    $('bkTable').querySelectorAll('input[type=checkbox]').forEach((el) => (el.onchange = () => {
      if (el.checked) bk.selected.add(el.dataset.id); else bk.selected.delete(el.dataset.id);
      bk.result = null; drawTable(); drawSummary();
    }));
  };
  const drawSummary = () => {
    const res = resultOf();
    if (!res) { $('bkSummary').textContent = '발송 대상 확인을 누르면 화주사별 건수와 발송 예정 여부가 표시됩니다.'; return; }
    const s = res.summary;
    const parts = [res.dry_run ? `발송 예정 ${s.ready}` : `발송 ${s.sent}`];
    if (s.skipped_empty) parts.push(`0건 제외 ${s.skipped_empty}`);
    if (s.skipped_test) parts.push(`테스트 생략 ${s.skipped_test}`);
    if (s.no_recipient) parts.push(`수신 담당자 없음 ${s.no_recipient}`);
    if (s.error) parts.push(`오류 ${s.error}`);
    $('bkSummary').innerHTML = `<b>${res.dry_run ? '발송 대상 확인' : '발송 결과'}</b> · ${parts.join(' · ')}${res.batch_id && !res.dry_run ? ` · 일괄 발송 번호 <span class="mono">${esc(res.batch_id)}</span>` : ''}`;
  };
  const invalidate = () => { bk.result = null; drawTable(); drawSummary(); };
  const payload = (dry) => ({ report_type: r.type, client_ids: [...bk.selected], ...periodParams(r), skip_empty: bk.skipEmpty, attach: bk.attach, dry_run: dry });

  $('rpPeriod').innerHTML = periodFieldsHtml(r);
  bindPeriodFields(r, invalidate);
  $('rpType').onchange = (e) => {
    r.type = e.target.value; bk.skipEmpty = ALERT_TYPES.includes(r.type);
    bk.selected = new Set(state.clients.filter((c) => recipientsFor(r.type, c.client_id).length).map((c) => c.client_id));
    bk.dry = null; bk.result = null; renderBulk(r);
  };
  $('bkSkip').onchange = (e) => { bk.skipEmpty = e.target.checked; invalidate(); };
  $('bkAttach').onchange = (e) => { bk.attach = e.target.checked; invalidate(); };
  $('bkSearch').oninput = (e) => { bk.q = e.target.value.trim(); drawTable(); };
  $('bkAll').onclick = () => { state.clients.forEach((c) => bk.selected.add(c.client_id)); invalidate(); };
  $('bkNone').onclick = () => { bk.selected.clear(); invalidate(); };
  $('bkHasTo').onclick = () => { bk.selected = new Set(state.clients.filter((c) => recipientsFor(r.type, c.client_id).length).map((c) => c.client_id)); invalidate(); };
  $('bkDry').onclick = async () => {
    if (!bk.selected.size) { toast('대상 화주사를 선택해 주세요.'); return; }
    $('bkDry').disabled = true; $('bkNote').textContent = `${bk.selected.size}곳의 메일을 미리 작성하는 중입니다...`; $('bkNote').className = 'note';
    try {
      bk.dry = await apiPost('/v1/reports/send', payload(true)); bk.dryKey = key(); bk.result = null;
      $('bkNote').textContent = '';
    } catch (e) { $('bkNote').textContent = `확인하지 못했습니다. ${e.message}`; $('bkNote').className = 'note warn'; }
    $('bkDry').disabled = false; drawTable(); drawSummary();
  };
  $('bkSend').onclick = async () => {
    if (!bk.dry || bk.dryKey !== key()) { toast('먼저 발송 대상 확인을 눌러 주세요.'); return; }
    const s = bk.dry.summary;
    if (!s.ready) { toast('발송 예정인 화주사가 없습니다.'); return; }
    const ok = await confirmBox(`${s.ready}곳에 일괄 발송할까요?`,
      `<b>${esc(REPORT_TYPES[r.type])}</b><br>대상 ${s.total}곳 중 발송 예정 ${s.ready}곳${s.skipped_empty ? `, 0건 제외 ${s.skipped_empty}곳` : ''}${s.skipped_test ? `, 테스트 생략 ${s.skipped_test}곳` : ''}${s.no_recipient ? `, 수신 담당자 없음 ${s.no_recipient}곳` : ''}입니다.<br><br>`
      + (test ? '테스트 모드입니다. 실제로는 TEST_RECIPIENT 메일로만 발송됩니다.' : '<b>실제 발송 모드입니다.</b> 화주사 담당자에게 메일이 발송됩니다.'), '일괄 발송');
    if (!ok) return;
    $('bkSend').disabled = true; $('bkDry').disabled = true; $('bkNote').textContent = '발송 중입니다. 화주사 수에 따라 1~2분 걸릴 수 있습니다.'; $('bkNote').className = 'note';
    try {
      bk.result = await apiPost('/v1/reports/send', payload(false));
      bk.dry = null;
      $('bkNote').textContent = ''; toast(`일괄 발송을 마쳤습니다. 발송 ${bk.result.summary.sent}곳`);
    } catch (e) { $('bkNote').textContent = `발송하지 못했습니다. ${e.message}`; $('bkNote').className = 'note warn'; }
    $('bkSend').disabled = false; $('bkDry').disabled = false; drawTable(); drawSummary();
  };
  drawTable(); drawSummary();
}

// ───────────────────────── 자동 발송 (예약) ─────────────────────────
const FREQ_LABELS = { daily: '매일', weekdays: '평일', weekly: '매주', monthly: '매월' };
const WEEKDAYS = ['', '월', '화', '수', '목', '금', '토', '일'];
async function renderSchedules() {
  $('view').innerHTML = '<div class="loading">예약 목록을 불러오는 중입니다...</div>';
  const res = await api('/v1/schedules', {}, false);
  state.sendMeta = res.meta;
  const list = res.data;
  const m = res.meta;
  const banner = m.scheduler_installed === true
    ? `<div class="card" style="margin-bottom:14px"><span class="badge good">자동 발송 실행기 켜짐</span> <span class="muted">매시간 예약을 확인해 시각이 된 예약을 발송합니다.</span></div>`
    : `<div class="error-box" style="margin-bottom:14px">자동 발송 실행기가 꺼져 있습니다. 예약을 저장해도 자동으로 발송되지 않습니다. 앱스 스크립트 편집기에서 <b>installScheduler</b> 함수를 한 번 실행해 주세요. '지금 실행'은 실행기와 관계없이 동작합니다.</div>`;
  const targetText = (s) => (s.target === 'all' ? `전체 화주사 ${state.clients.length}곳` : `${s.target.split(',').length}곳`);
  $('view').innerHTML = banner
    + (m.test_mode ? `<div class="note warn" style="margin:-4px 0 14px">테스트 모드: 예약 1건당 실제 발송은 처음 ${m.test_bulk_limit}곳까지이며, 모두 TEST_RECIPIENT 메일로 갑니다.</div>` : '')
    + `<div class="section-title"><h2>예약 ${list.length}건</h2><button class="btn primary" id="scAdd">예약 추가</button></div>`
    + tableHtml([
      { key: 'enabled', label: '사용', render: (s) => `<input type="checkbox" data-toggle="${s.schedule_id}" ${s.enabled ? 'checked' : ''}>` },
      { key: 'name', label: '예약 이름', render: (s) => `${esc(s.name)} <span class="muted mono">${s.schedule_id}</span>` },
      { key: 'report_type', label: '리포트', render: (s) => esc(REPORT_TYPES[s.report_type]) },
      { key: 'when_label', label: '발송 시각' },
      { key: 'target', label: '대상', render: (s) => esc(targetText(s)) },
      { key: 'skip_empty', label: '옵션', render: (s) => [s.skip_empty ? '0건 제외' : '', s.attach ? 'CSV 첨부' : ''].filter(Boolean).join(' · ') || '-' },
      { key: 'last_run_at', label: '최근 실행', render: (s) => (s.last_run_at ? `${dt(s.last_run_at)}<div class="muted">${esc(s.last_result || '')}</div>` : '-') },
      { key: 'actions', label: '', render: (s) => `<span style="display:flex;gap:6px;justify-content:flex-end"><button class="btn small" data-edit="${s.schedule_id}">수정</button><button class="btn small" data-run="${s.schedule_id}">지금 실행</button><button class="btn small" data-del="${s.schedule_id}">삭제</button></span>` },
    ], list, { empty: '예약이 없습니다. 예약 추가를 눌러 만들어 주세요.' })
    + `<div class="note" style="margin-top:10px">발송 시각은 한국 시간 기준이며, 실행기가 매시간 한 번 확인하므로 해당 시각의 0~59분 사이에 발송됩니다. 리포트 기간은 기준일 기준으로 일일 운영 요약은 당일, 기간형 리포트는 최근 7일, 월 정산서는 전월입니다.</div>`;

  const byId = Object.fromEntries(list.map((s) => [s.schedule_id, s]));
  const save = async (s, msg) => {
    await apiPost('/v1/schedules/save', { schedule: s });
    toast(msg); renderSchedules();
  };
  $('scAdd').onclick = () => openScheduleForm(null);
  $('view').querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => openScheduleForm(byId[b.dataset.edit])));
  $('view').querySelectorAll('[data-toggle]').forEach((el) => (el.onchange = async () => {
    const s = byId[el.dataset.toggle];
    try { await save({ ...s, enabled: el.checked }, el.checked ? '예약을 사용합니다.' : '예약을 사용하지 않습니다.'); } catch (e) { toast(`저장하지 못했습니다. ${e.message}`); el.checked = !el.checked; }
  }));
  $('view').querySelectorAll('[data-run]').forEach((b) => (b.onclick = async () => {
    const s = byId[b.dataset.run];
    const ok = await confirmBox('예약을 지금 실행할까요?', `<b>${esc(s.name)}</b><br>${REPORT_TYPES[s.report_type]} · ${esc(targetText(s))}${s.skip_empty ? ' · 0건 제외' : ''}<br><br>` + (m.test_mode ? `테스트 모드입니다. 처음 ${m.test_bulk_limit}곳까지만 TEST_RECIPIENT 메일로 발송됩니다.` : '<b>실제 발송 모드입니다.</b> 화주사 담당자에게 메일이 발송됩니다.'), '지금 실행');
    if (!ok) return;
    b.disabled = true; toast('실행 중입니다. 1~2분 걸릴 수 있습니다.', 8000);
    try {
      const r = await apiPost('/v1/schedules/run', { schedule_id: s.schedule_id });
      if (r.error) throw new Error(r.error);
      toast(`실행했습니다. 발송 ${r.summary.sent}곳`); renderSchedules();
    } catch (e) { toast(`실행하지 못했습니다. ${e.message}`); b.disabled = false; }
  }));
  $('view').querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    const s = byId[b.dataset.del];
    if (!(await confirmBox('예약을 삭제할까요?', `<b>${esc(s.name)}</b><br>삭제한 예약은 되돌릴 수 없습니다. 지금까지의 발송 기록은 남습니다.`, '삭제'))) return;
    try { await apiPost('/v1/schedules/delete', { schedule_id: s.schedule_id }); toast('예약을 삭제했습니다.'); renderSchedules(); } catch (e) { toast(`삭제하지 못했습니다. ${e.message}`); }
  }));
}

function openScheduleForm(s) {
  const f = s ? { ...s } : { name: '', report_type: 'daily_summary', frequency: 'weekdays', weekday: 1, month_day: 5, hour: 18, target: 'all', skip_empty: false, attach: true, enabled: true };
  const picked = new Set(f.target === 'all' ? [] : f.target.split(','));
  let q = '';
  const html = `
    <div class="report-form">
      <div class="field">예약 이름<input id="sfName" value="${esc(f.name)}" placeholder="예: 일일 운영 요약 (평일 18시)"></div>
      <div class="field">리포트 종류<select id="sfType">${Object.entries(REPORT_TYPES).map(([k, l]) => `<option value="${k}" ${f.report_type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="row-2">
        <div class="field">주기<select id="sfFreq">${Object.entries(FREQ_LABELS).map(([k, l]) => `<option value="${k}" ${f.frequency === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field">시각<select id="sfHour">${Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${Number(f.hour) === h ? 'selected' : ''}>${h}시</option>`).join('')}</select></div>
      </div>
      <div class="field" id="sfWeekdayBox">요일<select id="sfWeekday">${WEEKDAYS.slice(1).map((w, i) => `<option value="${i + 1}" ${Number(f.weekday) === i + 1 ? 'selected' : ''}>${w}요일</option>`).join('')}</select></div>
      <div class="field" id="sfDayBox">날짜<select id="sfDay">${Array.from({ length: 28 }, (_, i) => `<option value="${i + 1}" ${Number(f.month_day) === i + 1 ? 'selected' : ''}>${i + 1}일</option>`).join('')}</select></div>
      <div class="field">대상<select id="sfTarget"><option value="all" ${f.target === 'all' ? 'selected' : ''}>전체 화주사</option><option value="pick" ${f.target !== 'all' ? 'selected' : ''}>선택한 화주사</option></select></div>
      <div id="sfPickBox">
        <div class="field">화주사 검색<input id="sfSearch" placeholder="이름 또는 ID"></div>
        <div class="note" id="sfPickCount"></div>
        <div id="sfPickList" style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:12px"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px"><input type="checkbox" id="sfSkip" ${f.skip_empty ? 'checked' : ''}>안내할 내역이 0건인 화주사는 보내지 않음</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px"><input type="checkbox" id="sfAttach" ${f.attach ? 'checked' : ''}>전체 목록을 CSV 파일로 첨부</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:14px"><input type="checkbox" id="sfEnabled" ${f.enabled ? 'checked' : ''}>예약 사용</label>
      <button class="btn primary" id="sfSave" style="width:100%">저장</button>
      <div class="note" id="sfNote"></div>
    </div>`;
  openDrawer(s ? '예약 수정' : '예약 추가', html);
  const sync = () => {
    $('sfWeekdayBox').style.display = $('sfFreq').value === 'weekly' ? '' : 'none';
    $('sfDayBox').style.display = $('sfFreq').value === 'monthly' ? '' : 'none';
    $('sfPickBox').style.display = $('sfTarget').value === 'pick' ? '' : 'none';
  };
  const drawPick = () => {
    const list = state.clients.filter((c) => !q || c.name.includes(q) || c.client_id.toLowerCase().includes(q.toLowerCase()));
    $('sfPickList').innerHTML = list.map((c) => `<label style="display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0"><input type="checkbox" data-id="${c.client_id}" ${picked.has(c.client_id) ? 'checked' : ''}>${esc(c.name)} <span class="muted">${c.client_id}</span></label>`).join('');
    $('sfPickList').querySelectorAll('input').forEach((el) => (el.onchange = () => { if (el.checked) picked.add(el.dataset.id); else picked.delete(el.dataset.id); $('sfPickCount').textContent = `${picked.size}곳 선택`; }));
    $('sfPickCount').textContent = `${picked.size}곳 선택`;
  };
  $('sfFreq').onchange = sync; $('sfTarget').onchange = sync;
  $('sfType').onchange = () => { $('sfSkip').checked = ALERT_TYPES.includes($('sfType').value); };
  $('sfSearch').oninput = (e) => { q = e.target.value.trim(); drawPick(); };
  sync(); drawPick();
  $('sfSave').onclick = async () => {
    const body = {
      schedule_id: s ? s.schedule_id : undefined, name: $('sfName').value.trim(), report_type: $('sfType').value,
      frequency: $('sfFreq').value, hour: Number($('sfHour').value), weekday: Number($('sfWeekday').value), month_day: Number($('sfDay').value),
      target: $('sfTarget').value === 'all' ? 'all' : [...picked], skip_empty: $('sfSkip').checked, attach: $('sfAttach').checked, enabled: $('sfEnabled').checked,
    };
    if (!body.name) { $('sfNote').textContent = '예약 이름을 입력해 주세요.'; $('sfNote').className = 'note warn'; return; }
    if (body.target !== 'all' && !body.target.length) { $('sfNote').textContent = '대상 화주사를 1곳 이상 선택해 주세요.'; $('sfNote').className = 'note warn'; return; }
    $('sfSave').disabled = true;
    try {
      await apiPost('/v1/schedules/save', { schedule: body });
      closeDrawer(); toast('예약을 저장했습니다.'); renderSchedules();
    } catch (e) { $('sfNote').textContent = `저장하지 못했습니다. ${e.message}`; $('sfNote').className = 'note warn'; $('sfSave').disabled = false; }
  };
}

function confirmBox(title, html, yesLabel) {
  return new Promise((resolve) => {
    $('confirmTitle').textContent = title; $('confirmBody').innerHTML = html;
    $('confirmYes').textContent = yesLabel || '확인';
    $('confirmModal').style.display = 'flex';
    const done = (v) => { $('confirmModal').style.display = 'none'; resolve(v); };
    $('confirmYes').onclick = () => done(true); $('confirmNo').onclick = () => done(false);
  });
}

// ───────────────────────── 시작 ─────────────────────────
(async () => {
  loadConfig();
  render();
  if (!state.baseUrl || !state.apiKey) { openSettings(); return; }
  try { await connect(); render(); } catch (e) { openSettings(`저장된 설정으로 연결하지 못했습니다. (${e.message})`); }
})();
</script>
</body>
</html>
